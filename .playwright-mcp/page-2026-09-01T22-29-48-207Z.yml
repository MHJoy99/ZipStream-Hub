              - list [ref=f3e862]:
                - listitem [ref=f3e863]:
                  - strong [ref=f3e864]: "⚡ Zero-Download Streaming:"
                  - text: Streams media directly from remote HTTP/HTTPS ZIP archives over standard HTTP 206 byte-range requests.
                - listitem [ref=f3e865]:
                  - strong [ref=f3e866]: "📦 Full ZIP / ZIP64 & Store Support:"
                  - text: Supports massive archives > 4GB (up to 16 Exabytes) with
                  - code [ref=f3e867]: STORE
                  - text: and
                  - code [ref=f3e868]: DEFLATE
                  - text: methods.
                - listitem [ref=f3e869]:
                  - strong [ref=f3e870]: "🚀 Intelligent Sliding-Window Prefetcher:"
                  - text: Multi-threaded read-ahead buffer (default 32MB) with 128KB chunk slicing for butter-smooth playback and sub-second seek times.
                - listitem [ref=f3e871]:
                  - strong [ref=f3e872]: "🎯 1-Click Native Player Integration:"
                  - text: Auto-detects local media players (
                  - strong [ref=f3e873]: PotPlayer
                  - text: ","
                  - strong [ref=f3e874]: MPV
                  - text: ","
                  - strong [ref=f3e875]: VLC
                  - text: ","
                  - strong [ref=f3e876]: MPC-HC
                  - text: ","
                  - strong [ref=f3e877]: MPC-BE
                  - text: ","
                  - strong [ref=f3e878]: IINA
                  - text: ) via Windows Registry and system PATH.
                - listitem [ref=f3e879]:
                  - strong [ref=f3e880]: "🌐 In-Browser Web Player & Dark-Mode Dashboard:"
                  - text: Built-in HTML5 video player with fullscreen mode, playback speed control, and live stream telemetry.
                - listitem [ref=f3e881]:
                  - strong [ref=f3e882]: "📺 M3U / M3U8 IPTV Playlist Generator:"
                  - text: Instantly export complete archive playlists for
                  - strong [ref=f3e883]: Kodi
                  - text: ","
                  - strong [ref=f3e884]: Infuse (Apple TV/iOS)
                  - text: ", and VLC."
                - listitem [ref=f3e885]:
                  - strong [ref=f3e886]:
                    - text: 💬 Auto Subtitle (.srt
                    - generic [ref=f3e887]: $\to$
                    - text: "WebVTT) Engine:"
                  - text: Automatic subtitle detection and on-the-fly conversion of
                  - code [ref=f3e888]: .srt
                  - text: tracks to WebVTT for seamless browser viewing.
                - listitem [ref=f3e889]:
                  - strong [ref=f3e890]: "⭐ Archive History & Bookmarks:"
                  - text: Quick-access storage for frequently inspected archives with 1-click reloading and saved seek positions.
                - listitem [ref=f3e891]:
                  - strong [ref=f3e892]: "🪟 Windows 1-Click Launcher:"
                  - text: Effortless background startup via
                  - code [ref=f3e893]: launch_zipstream.vbs
                  - text: ", desktop shortcuts, and automatic browser launch."
                - listitem [ref=f3e894]:
                  - strong [ref=f3e895]: "💻 Interactive Terminal Player:"
                  - text: Colorful ANSI CLI (
                  - code [ref=f3e896]: cli.py
                  - text: /
                  - code [ref=f3e897]: zipplay.bat
                  - text: ) for keyboard-driven episode selection.
