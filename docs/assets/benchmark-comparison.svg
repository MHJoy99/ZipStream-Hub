<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" width="100%" height="100%">
  <defs>
    <radialGradient id="bg-glow" cx="50%" cy="40%" r="80%">
      <stop offset="0%" stop-color="#111827" />
      <stop offset="60%" stop-color="#0B0F19" />
      <stop offset="100%" stop-color="#05080E" />
    </radialGradient>

    <!-- Card Backgrounds -->
    <linearGradient id="bad-card-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(239, 68, 68, 0.08)" />
      <stop offset="100%" stop-color="rgba(239, 68, 68, 0.01)" />
    </linearGradient>

    <linearGradient id="good-card-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(0, 240, 255, 0.12)" />
      <stop offset="60%" stop-color="rgba(16, 185, 129, 0.06)" />
      <stop offset="100%" stop-color="rgba(15, 23, 42, 0.4)" />
    </linearGradient>

    <linearGradient id="bar-slow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#EF4444" />
      <stop offset="100%" stop-color="#F87171" />
    </linearGradient>

    <linearGradient id="bar-fast" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F0FF" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>

    <filter id="shadow-box" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#000000" flood-opacity="0.6" />
    </filter>

    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255, 255, 255, 0.025)" stroke-width="1" />
    </pattern>
  </defs>

  <style>
    .font-sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Ubuntu, sans-serif; }
    .font-mono { font-family: 'SF Mono', Monaco, 'Cascadia Code', 'Roboto Mono', Consolas, monospace; }
  </style>

  <!-- Background Canvas -->
  <rect width="1200" height="680" fill="url(#bg-glow)" />
  <rect width="1200" height="680" fill="url(#grid)" />

  <!-- Ambient lights -->
  <circle cx="280" cy="320" r="180" fill="#EF4444" opacity="0.04" filter="blur(70px)" />
  <circle cx="900" cy="320" r="200" fill="#00F0FF" opacity="0.05" filter="blur(70px)" />

  <!-- HEADER -->
  <g transform="translate(60, 48)">
    <rect x="0" y="0" width="168" height="26" rx="13" fill="rgba(16, 185, 129, 0.1)" stroke="rgba(16, 185, 129, 0.3)" stroke-width="1" />
    <circle cx="12" cy="13" r="4" fill="#10B981" />
    <text x="24" y="17" fill="#34D399" class="font-mono" font-size="11" font-weight="600" letter-spacing="1.5">PERFORMANCE AUDIT</text>
    
    <text x="0" y="58" fill="#FFFFFF" class="font-sans" font-size="28" font-weight="800" letter-spacing="-0.5">ZipStream Hub vs Traditional Workflow</text>
    <text x="0" y="80" fill="#94A3B8" class="font-sans" font-size="14">Empirical benchmark comparing 20GB 4K UHD video payload extraction against zero-copy tail-streaming</text>
  </g>

  <!-- LEFT PANEL: TRADITIONAL METHOD -->
  <g transform="translate(60, 150)" filter="url(#shadow-box)">
    <rect width="520" height="480" rx="18" fill="url(#bad-card-grad)" stroke="rgba(239, 68, 68, 0.25)" stroke-width="1.2" />
    
    <!-- Top badge -->
    <g transform="translate(24, 24)">
      <rect width="472" height="42" rx="10" fill="rgba(239, 68, 68, 0.12)" stroke="rgba(239, 68, 68, 0.3)" stroke-width="1" />
      <circle cx="20" cy="21" r="6" fill="#EF4444" />
      <text x="36" y="26" fill="#FCA5A5" class="font-sans" font-size="14" font-weight="700">TRADITIONAL DOWNLOAD &amp; EXTRACT</text>
      <text x="450" y="26" fill="#EF4444" class="font-mono" font-size="12" font-weight="700" text-anchor="end">FAILED EFFICIENCY</text>
    </g>

    <!-- Metrics List -->
    <!-- Metric 1: Time to Play -->
    <g transform="translate(24, 86)">
      <text x="0" y="14" fill="#94A3B8" class="font-sans" font-size="12" font-weight="600">TIME TO FIRST FRAME (20GB FILE)</text>
      <text x="472" y="14" fill="#EF4444" class="font-mono" font-size="15" font-weight="800" text-anchor="end">15 ~ 25 min</text>
      
      <!-- Bar Container -->
      <rect y="24" width="472" height="28" rx="6" fill="rgba(255, 255, 255, 0.04)" stroke="rgba(255, 255, 255, 0.06)" />
      <rect y="24" width="472" height="28" rx="6" fill="url(#bar-slow)" />
      <text x="14" y="43" fill="#FFFFFF" class="font-sans" font-size="11" font-weight="700">Full Download (12m) + ZIP Extraction (6m)</text>
    </g>

    <!-- Metric 2: Disk Overhead -->
    <g transform="translate(24, 168)">
      <text x="0" y="14" fill="#94A3B8" class="font-sans" font-size="12" font-weight="600">LOCAL DISK SPACE REQUIRED</text>
      <text x="472" y="14" fill="#EF4444" class="font-mono" font-size="15" font-weight="800" text-anchor="end">40.0 GB</text>
      
      <rect y="24" width="472" height="28" rx="6" fill="rgba(255, 255, 255, 0.04)" stroke="rgba(255, 255, 255, 0.06)" />
      <rect y="24" width="472" height="28" rx="6" fill="url(#bar-slow)" opacity="0.85" />
      <text x="14" y="43" fill="#FFFFFF" class="font-sans" font-size="11" font-weight="700">20GB .zip archive + 20GB uncompressed media</text>
    </g>

    <!-- Metric 3: Seek Latency -->
    <g transform="translate(24, 250)">
      <text x="0" y="14" fill="#94A3B8" class="font-sans" font-size="12" font-weight="600">TIMELINE SCRUBBING &amp; PREVIEW</text>
      <text x="472" y="14" fill="#EF4444" class="font-mono" font-size="15" font-weight="800" text-anchor="end">BLOCKED</text>
      
      <rect y="24" width="472" height="28" rx="6" fill="rgba(255, 255, 255, 0.04)" stroke="rgba(255, 255, 255, 0.06)" />
      <rect y="24" width="472" height="28" rx="6" fill="rgba(239, 68, 68, 0.4)" />
      <text x="14" y="43" fill="#FCA5A5" class="font-sans" font-size="11" font-weight="600">Impossible until 100% downloaded &amp; extracted</text>
    </g>

    <!-- Key Downsides Summary -->
    <g transform="translate(24, 332)">
      <rect width="472" height="120" rx="10" fill="rgba(0, 0, 0, 0.3)" stroke="rgba(239, 68, 68, 0.15)" />
      <text x="16" y="26" fill="#EF4444" class="font-mono" font-size="11" font-weight="700">PAIN POINTS &amp; BOTTLENECKS</text>
      
      <circle cx="24" cy="50" r="3" fill="#EF4444" />
      <text x="36" y="54" fill="#CBD5E1" class="font-sans" font-size="12">Massive SSD write wear and tear (double writing)</text>
      
      <circle cx="24" cy="74" r="3" fill="#EF4444" />
      <text x="36" y="78" fill="#CBD5E1" class="font-sans" font-size="12">Wasted bandwidth if only watching the first 10 minutes</text>
      
      <circle cx="24" cy="98" r="3" fill="#EF4444" />
      <text x="36" y="102" fill="#CBD5E1" class="font-sans" font-size="12">High CPU &amp; thermal load during decompression</text>
    </g>
  </g>

  <!-- RIGHT PANEL: ZIPSTREAM HUB -->
  <g transform="translate(620, 150)" filter="url(#shadow-box)">
    <rect width="520" height="480" rx="18" fill="url(#good-card-grad)" stroke="rgba(0, 240, 255, 0.35)" stroke-width="1.5" />
    
    <!-- Top badge -->
    <g transform="translate(24, 24)">
      <rect width="472" height="42" rx="10" fill="rgba(0, 240, 255, 0.12)" stroke="rgba(0, 240, 255, 0.3)" stroke-width="1" />
      <circle cx="20" cy="21" r="6" fill="#00F0FF" />
      <text x="36" y="26" fill="#E0F2FE" class="font-sans" font-size="14" font-weight="800">ZIPSTREAM HUB (ZERO-COPY PIPELINE)</text>
      <text x="450" y="26" fill="#00F0FF" class="font-mono" font-size="12" font-weight="800" text-anchor="end">INSTANT PLAY</text>
    </g>

    <!-- Metrics List -->
    <!-- Metric 1: Time to Play -->
    <g transform="translate(24, 86)">
      <text x="0" y="14" fill="#94A3B8" class="font-sans" font-size="12" font-weight="600">TIME TO FIRST FRAME (20GB FILE)</text>
      <text x="472" y="14" fill="#00F0FF" class="font-mono" font-size="15" font-weight="800" text-anchor="end">&lt; 0.60 s</text>
      
      <!-- Bar Container -->
      <rect y="24" width="472" height="28" rx="6" fill="rgba(255, 255, 255, 0.04)" stroke="rgba(255, 255, 255, 0.06)" />
      <rect y="24" width="30" height="28" rx="6" fill="url(#bar-fast)" />
      <text x="42" y="43" fill="#38BDF8" class="font-mono" font-size="11" font-weight="700">0.58s (Tail parse only: 64KB HTTP Range)</text>
    </g>

    <!-- Metric 2: Disk Overhead -->
    <g transform="translate(24, 168)">
      <text x="0" y="14" fill="#94A3B8" class="font-sans" font-size="12" font-weight="600">LOCAL DISK SPACE REQUIRED</text>
      <text x="472" y="14" fill="#10B981" class="font-mono" font-size="15" font-weight="800" text-anchor="end">0.0 MB</text>
      
      <rect y="24" width="472" height="28" rx="6" fill="rgba(255, 255, 255, 0.04)" stroke="rgba(255, 255, 255, 0.06)" />
      <rect y="24" width="12" height="28" rx="6" fill="#10B981" />
      <text x="24" y="43" fill="#34D399" class="font-mono" font-size="11" font-weight="700">Zero Disk Space! Direct RAM prefetch ring buffer</text>
    </g>

    <!-- Metric 3: Seek Latency -->
    <g transform="translate(24, 250)">
      <text x="0" y="14" fill="#94A3B8" class="font-sans" font-size="12" font-weight="600">TIMELINE SCRUBBING &amp; PREVIEW</text>
      <text x="472" y="14" fill="#00F0FF" class="font-mono" font-size="15" font-weight="800" text-anchor="end">REALTIME (0ms)</text>
      
      <rect y="24" width="472" height="28" rx="6" fill="rgba(255, 255, 255, 0.04)" stroke="rgba(255, 255, 255, 0.06)" />
      <rect y="24" width="472" height="28" rx="6" fill="rgba(0, 240, 255, 0.15)" stroke="rgba(0, 240, 255, 0.4)" />
      <text x="14" y="43" fill="#E0F2FE" class="font-sans" font-size="11" font-weight="700">Instant arbitrary position seeking with byte-offset math</text>
    </g>

    <!-- Key Advantages Summary -->
    <g transform="translate(24, 332)">
      <rect width="472" height="120" rx="10" fill="rgba(0, 0, 0, 0.35)" stroke="rgba(0, 240, 255, 0.2)" />
      <text x="16" y="26" fill="#00F0FF" class="font-mono" font-size="11" font-weight="700">KEY ARCHITECTURAL HIGHLIGHTS</text>
      
      <circle cx="24" cy="50" r="3" fill="#10B981" />
      <text x="36" y="54" fill="#E2E8F0" class="font-sans" font-size="12"><tspan font-weight="700" fill="#38BDF8">Instant Play:</tspan> Jump straight into 4K HDR video in under a second</text>
      
      <circle cx="24" cy="74" r="3" fill="#10B981" />
      <text x="36" y="78" fill="#CBD5E1" class="font-sans" font-size="12"><tspan font-weight="700" fill="#38BDF8">Hardware Friendly:</tspan> 0 bytes written to SSD, lightweight on RAM</text>
      
      <circle cx="24" cy="98" r="3" fill="#10B981" />
      <text x="36" y="102" fill="#CBD5E1" class="font-sans" font-size="12"><tspan font-weight="700" fill="#38BDF8">Bandwidth Efficient:</tspan> Only streams chunks requested by media player</text>
    </g>
  </g>
</svg>